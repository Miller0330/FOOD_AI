<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物辨識與營養管理</title>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f6efe1;
            padding-bottom: 50px;
        }
        .header {
            background: linear-gradient(135deg, #ab8158, #8a6642);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            text-align: center;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card {
            background-color: #fffbf3;
            border-radius: 15px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            border: none;
        }
        .card-header {
            background: linear-gradient(135deg, #ddba8b, #c69c68);
            color: #4a3624;
            border-radius: 15px 15px 0 0 !important;
            padding: 15px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #c69c68, #ab8158);
            border: none;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #b78b56, #8a6642);
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        .file-upload {
            position: relative;
            overflow: hidden;
            margin: 10px 0;
            text-align: center;
        }
        .file-upload input[type=file] {
            display: none;
        }
        .upload-label {
            display: block;
            padding: 40px 20px;
            background-color: #f6efe1;
            border: 2px dashed #d4b896;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-label:hover {
            background-color: #efe4d0;
        }
        .upload-icon {
            font-size: 48px;
            color: #ab8158;
            margin-bottom: 10px;
        }
        #preview-container {
            display: none;
            margin-top: 20px;
        }
        #image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .features {
            margin-top: 30px;
        }
        .feature-icon {
            font-size: 36px;
            color: #ab8158;
            margin-bottom: 15px;
        }
        .weight-display {
            background: linear-gradient(135deg, #9caf88, #7f9873);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .weight-value {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
        .weight-unit {
            font-size: 18px;
            opacity: 0.9;
        }
        .weight-status {
            text-align: center;
            margin-top: 10px;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-connected {
            background-color: #28a745;
        }
        .status-disconnected {
            background-color: #dc3545;
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }
            .card {
                margin-bottom: 15px;
            }
            .upload-label {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>食物辨識與營養管理</h1>
        </div>
    </div>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- 重量顯示區域 -->
                <div class="weight-display">
                    <h5 class="text-center mb-3">磅秤重量</h5>
                    <div class="weight-value" id="weight-value">0.0 <span class="weight-unit">g</span></div>
                    <div class="weight-status">
                        <span class="status-indicator" id="status-indicator"></span>
                        <span id="connection-status">等待使用者按下更新...</span>
                    </div>
                    <div class="text-center mt-3">
                        <button type="button" class="btn btn-light btn-sm" onclick="updateWeight()">
                            <span>🔄 刷新重量</span>
                        </button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header p-0" style="background: transparent; box-shadow:none;">
                        <ul class="nav nav-tabs" id="detect-mode-tabs" style="border:none; padding: 10px 10px 0;">
                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-fruit" type="button">🍎 水果／零食辨識</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-meal" type="button">🍚 三餐主食辨識（測試版）</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="tab-fruit">
                                <form action="/detect" method="post" enctype="multipart/form-data" class="upload-form" onsubmit="return submitWithWeight(this)">
                                    <input type="hidden" class="weight-input" name="weight" value="0">
                                    <div class="file-upload">
                                        <label class="upload-label upload-area">
                                            <div class="upload-icon">📷</div>
                                            <h5>點擊上傳照片或拍攝照片</h5>
                                            <p class="text-muted">支援 JPG、PNG 格式，辨識水果、餅乾等9類</p>
                                            <input type="file" class="file-input" name="file" accept="image/*" onchange="previewImage(this)">
                                        </label>
                                    </div>
                                    <div class="preview-container text-center" style="display:none;">
                                        <img class="image-preview" src="#" alt="Preview">
                                        <div class="mt-3">
                                            <button type="button" class="btn btn-outline-secondary me-2" onclick="resetForm(this)">重新選擇</button>
                                            <button type="submit" class="btn btn-primary"><span>開始辨識</span></button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="tab-pane fade" id="tab-meal">
                                <p class="text-muted small">測試版：使用UEC FOOD 100資料集訓練，涵蓋飯類、麵類、日式家常菜等100種主食類別，準確度仍在調校中。</p>
                                <form action="/detect100" method="post" enctype="multipart/form-data" class="upload-form" onsubmit="return submitWithWeight(this)">
                                    <input type="hidden" class="weight-input" name="weight" value="0">
                                    <div class="file-upload">
                                        <label class="upload-label upload-area">
                                            <div class="upload-icon">🍱</div>
                                            <h5>點擊上傳照片或拍攝照片</h5>
                                            <p class="text-muted">支援 JPG、PNG 格式，辨識飯、麵、便當菜等100類</p>
                                            <input type="file" class="file-input" name="file" accept="image/*" onchange="previewImage(this)">
                                        </label>
                                    </div>
                                    <div class="preview-container text-center" style="display:none;">
                                        <img class="image-preview" src="#" alt="Preview">
                                        <div class="mt-3">
                                            <button type="button" class="btn btn-outline-secondary me-2" onclick="resetForm(this)">重新選擇</button>
                                            <button type="submit" class="btn btn-primary"><span>開始辨識</span></button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="features">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <div class="feature-icon">🍎</div>
                            <h5>食物辨識</h5>
                            <p>智慧辨識常見食物種類</p>
                        </div>
                        <div class="col-md-4">
                            <div class="feature-icon">📊</div>
                            <h5>營養分析</h5>
                            <p>計算食物營養成分</p>
                        </div>
                        <div class="col-md-4">
                            <div class="feature-icon">📱</div>
                            <h5>便捷管理</h5>
                            <p>隨時隨地記錄飲食</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 重量數據更新功能
        let currentWeight = 0; // 保存當前重量
        
        function updateWeight() {
            console.log('開始獲取重量數據...');
            const statusIndicator = document.getElementById('status-indicator');
            const connectionStatus = document.getElementById('connection-status');
            
            // 顯示讀取中狀態
            connectionStatus.textContent = '讀取中...';
            statusIndicator.className = 'status-indicator';
            statusIndicator.style.backgroundColor = '#ffc107'; // 黃色表示讀取中
            
            fetch('/api/weight')
                .then(response => {
                    console.log('API 響應狀態:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('收到數據:', data);
                    if (data.success) {
                        const weightData = data.data;
                        currentWeight = weightData.weight; // 更新當前重量變數
                        document.getElementById('weight-value').innerHTML = 
                            `${weightData.weight.toFixed(1)} <span class="weight-unit">g</span>`;
                        
                        if (weightData.is_connected) {
                            statusIndicator.className = 'status-indicator status-connected';
                            connectionStatus.textContent = '已連接';
                        } else {
                            statusIndicator.className = 'status-indicator status-disconnected';
                            connectionStatus.textContent = '未連接';
                        }
                        
                        if (weightData.last_update) {
                            console.log('數據更新時間:', weightData.last_update);
                        }
                    } else {
                        console.error('API 返回錯誤:', data.error);
                        statusIndicator.className = 'status-indicator status-disconnected';
                        connectionStatus.textContent = '讀取失敗: ' + (data.error || '未知錯誤');
                    }
                })
                .catch(error => {
                    console.error('獲取重量數據失敗:', error);
                    statusIndicator.className = 'status-indicator status-disconnected';
                    connectionStatus.textContent = '連接錯誤';
                });
        }
        
        function submitWithWeight(form) {
            // 直接使用當前顯示的重量值
            form.querySelector('.weight-input').value = currentWeight;
            console.log('辨識時重量:', currentWeight + 'g');

            // 記錄按下按鈕的時間點，讓結果頁能算出「使用者實際等待時間」
            // （伺服器算的總處理時間不包含上傳/下載/頁面渲染，使用者感受到的等待通常更長）
            try {
                sessionStorage.setItem('detect_click_time', Date.now().toString());
            } catch (e) {}

            // 送出後立刻鎖住按鈕、顯示處理中，避免使用者以為沒反應而重複點擊
            // （伺服器單一worker一次只能處理一個請求，重複點擊會讓兩次請求排隊疊加等待時間）
            const submitBtn = form.querySelector('button[type=submit]');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>辨識中，請稍候…';
            }
            const cancelBtn = form.querySelector('button[type=button]');
            if (cancelBtn) cancelBtn.disabled = true;

            return true; // 繼續提交表單
        }
        
        // 頁面載入時初始化，但不自動讀取重量
        document.addEventListener('DOMContentLoaded', function() {
            // 可以在這裡添加其他初始化邏輯
            console.log('頁面已載入，請點擊刷新按鈕獲取重量');
        });
        
        function previewImage(input) {
            if (input.files && input.files[0]) {
                var form = input.closest('.upload-form');
                var reader = new FileReader();

                reader.onload = function(e) {
                    form.querySelector('.image-preview').src = e.target.result;
                    form.querySelector('.preview-container').style.display = 'block';
                    form.querySelector('.upload-area').style.display = 'none';
                }

                reader.readAsDataURL(input.files[0]);
            }
        }

        function resetForm(button) {
            var form = button.closest('.upload-form');
            form.reset();
            form.querySelector('.preview-container').style.display = 'none';
            form.querySelector('.upload-area').style.display = 'block';
        }

        // Enable camera capture on mobile
        if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
            document.querySelectorAll('.file-input').forEach(function(fileInput) {
                fileInput.setAttribute('capture', 'environment');
            });
        }
    </script>
    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
</body>
</html>
